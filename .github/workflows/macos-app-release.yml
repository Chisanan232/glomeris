name: macOS App Release

# cargo-dist (release.yml, dist-managed — do not hand-edit) builds and
# publishes the Rust `glomeris` CLI binary but has no notion of the Swift
# menu-bar app under macos/GlomerisMenuBar/. This workflow is a separate,
# non-conflicting pipeline that runs after dist's release.yml has already
# created the GitHub Release: it downloads the just-published
# aarch64-apple-darwin CLI tarball, builds GlomerisMenuBar.app, embeds the
# released binary into the bundle, and uploads the zipped app as an extra
# asset on that same release.
#
# Trigger choice: `release: types: [published]` instead of matching
# release.yml's `push: tags:` pattern. release.yml's `host` job creates the
# GitHub Release with `gh release create ... artifacts/*` in a single call
# (assets are attached atomically, not uploaded in a later step), so the
# `published` event only fires once the release and all of dist's artifacts
# already exist — no race to coordinate, no risk of two tag-triggered
# workflows starting in parallel and this one downloading an asset that
# isn't uploaded yet. It also naturally skips PR runs of release.yml (which
# never publish a release) without needing to duplicate release.yml's
# tag-matching regex here.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the app build to (defaults to the latest release)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: macos-app-release-${{ github.event.release.tag_name || inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    # HORO-1296: runner and Xcode pinned to match ci.yml's `macos-app` job.
    # This workflow has never actually run (it triggers only on a published
    # release, and there has not been one), and on macos-14's default Xcode
    # 15.4 its build step could not have succeeded: XcodeGen emits
    # `objectVersion = 77` and that Xcode rejects the project unopened —
    # "a future Xcode project file format (77)", exit 74. That was measured on
    # ci.yml's new job, which runs the same xcodebuild against the same
    # project, so the failure here was latent rather than hypothetical.
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      ASSET_NAME: glomeris-aarch64-apple-darwin.tar.xz
    steps:
      - uses: actions/checkout@v4

      - name: Select the pinned Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Resolve release tag
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$EVENT_TAG" ]; then
            TAG="$EVENT_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download released CLI binary archive
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$ASSET_NAME" \
            --output "$ASSET_NAME" \
            --clobber

      - name: Extract glomeris binary
        run: |
          set -euo pipefail
          mkdir -p extracted
          tar -xJf "$ASSET_NAME" -C extracted
          # `|| true` is not strictly needed — `find -print -quit` exits 0 when it
          # matches nothing, so the guard below is reachable. It is here so that
          # stays true if the command ever grows a pipe or changes tool, which is
          # how the other sites in this file came to be broken.
          BIN_PATH="$(find extracted -type f -name glomeris -print -quit || true)"
          if [ -z "$BIN_PATH" ]; then
            echo "::error::glomeris binary not found inside $ASSET_NAME"
            exit 1
          fi
          chmod +x "$BIN_PATH"
          echo "bin_path=$BIN_PATH" >> "$GITHUB_ENV"

      - name: Read the released CLI's own version
        # HORO-1329: the number stamped into the bundle comes from the binary
        # that is about to be embedded in it, not from the tag. The CLI inside
        # the .app is the ground truth for "what version is this app", and
        # deriving the stamp from anything else reintroduces the two-answers
        # problem this ticket exists to fix — the bundle shipped 0.1.0 while
        # the crate was at 0.2.0.
        #
        # The tag is still cross-checked, one step below, rather than trusted:
        # if the downloaded asset and the tag disagree, that is a release-
        # assembly bug and should stop the run, not be silently papered over.
        run: |
          set -euo pipefail
          # `glomeris --version` prints "glomeris X.Y.Z".
          # `|| true` is load-bearing. Without it a CLI that cannot run at all —
          # wrong architecture, missing dylib, not executable — makes this pipeline
          # non-zero, `pipefail` carries that into the assignment, and `set -e`
          # ends the step here. The error below, which names the binary that could
          # not be read, never prints and the release fails with an empty log.
          CLI_VERSION="$("$bin_path" --version | awk 'NR==1 {print $2}' || true)"
          if [ -z "$CLI_VERSION" ]; then
            echo "::error::could not read a version from '$bin_path --version'"
            exit 1
          fi
          echo "cli_version=$CLI_VERSION" >> "$GITHUB_ENV"
          echo "embedded CLI reports version $CLI_VERSION"

      - name: Build GlomerisMenuBar.app
        run: |
          set -euo pipefail
          xcodebuild \
            -project macos/GlomerisMenuBar/GlomerisMenuBar.xcodeproj \
            -scheme GlomerisMenuBar \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            MARKETING_VERSION="$cli_version"

      - name: Embed released binary into app bundle
        run: |
          set -euo pipefail
          APP="build/GlomerisMenuBar.app"
          DEST="$APP/Contents/MacOS/glomeris"
          cp "$bin_path" "$DEST"
          chmod +x "$DEST"

          # HORO-1466: record WHICH binary this is, so the app can tell at
          # runtime whether the `glomeris` it resolved is this one.
          #
          # A hash and not the version string: two binaries measured on one
          # machine both answered `--version` with 0.2.0 while disagreeing
          # about whether an unscoped mutating action may be offered at all.
          # The version is stamped from the crate version and does not change
          # between merges, so a version comparison in the app would be a
          # check that cannot fail for the case it exists to catch.
          #
          # Written with PlistBuddy here rather than expanded from a build
          # setting in Sources/Info.plist deliberately. Info.plist variable
          # expansion fails SILENTLY — an unset setting leaves an empty string
          # — and an empty expected hash would read to the app as "this build
          # records none", i.e. exactly the developer-build state, in a
          # released bundle. Doing it after the copy also means the value is
          # computed from the bytes that actually shipped, not from a
          # download that a later step could have replaced.
          #
          # Before `codesign` below, because editing Info.plist invalidates
          # the seal; the re-sign has to be the last thing that touches the
          # bundle.
          # `|| true` is load-bearing: a missing or unreadable $DEST makes shasum
          # exit non-zero, and without this the step dies here instead of printing
          # the length error below that names the file. Note the sibling site in
          # the verify step further down already had its `|| true` — this one and
          # that one sit in the same file doing the same thing.
          CLI_SHA256="$(/usr/bin/shasum -a 256 "$DEST" | awk '{print $1}' || true)"
          if [ ${#CLI_SHA256} -ne 64 ]; then
            echo "::error::expected a 64-character SHA-256 for $DEST, got '$CLI_SHA256'"
            exit 1
          fi
          /usr/libexec/PlistBuddy \
            -c "Add :GlomerisExpectedCLISHA256 string $CLI_SHA256" \
            "$APP/Contents/Info.plist"
          echo "embedded CLI SHA-256: $CLI_SHA256"

          # Ad-hoc self-sign only (identity "-", no Apple Developer account
          # or certificate involved). Embedding a new executable after the
          # build invalidates the bundle's original ad-hoc seal, so this
          # re-seals it well enough to launch locally on the machine that
          # unzips it. This is NOT the code signing / notarization that
          # Gatekeeper requires for a binary downloaded via a browser
          # (which sets the quarantine xattr) — that requires a real
          # Developer ID and notarization ticket and is deliberately out of
          # scope here; see HORO-1071.
          codesign --force --deep --sign - "$APP"

      - name: Verify the bundle, the embedded CLI and the tag all agree
        # HORO-1329. Three numbers that were previously unrelated:
        #   * what the .app reports (Finder, About, CFBundleShortVersionString)
        #   * what the CLI inside it reports
        #   * the tag this asset is being attached to
        # The stamp above makes the first two equal by construction, so this
        # step's job is to prove the construction actually worked — Info.plist
        # expansion is silent when it fails and would leave the literal
        # "$(MARKETING_VERSION)", or an empty string, in a shipped bundle.
        #
        # A leading "v" is the only tag decoration stripped. release.yml's
        # trigger allows other prefixes, so an unexpected tag shape fails here
        # loudly rather than producing a bundle labelled with a number nobody
        # can trace back to a release.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          APP="build/GlomerisMenuBar.app"
          # HORO-1479: both substitutions are failure-tolerant so that the
          # echoes and comparisons below run in the case they were written for.
          # PlistBuddy exits non-zero when the key is absent, and the CLI read is
          # a pipeline under `pipefail`, so either one used to end the step on
          # its own line — leaving a reader a red step, an empty log, and no
          # indication of which of the three versions could not be read. This is
          # the shape `STAMPED_SHA256` further down already had.
          BUNDLE_VERSION="$(
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
              "$APP/Contents/Info.plist" || true
          )"
          EMBEDDED_VERSION="$("$APP/Contents/MacOS/glomeris" --version | awk 'NR==1 {print $2}' || true)"
          TAG_VERSION="${TAG#v}"

          echo "bundle CFBundleShortVersionString: ${BUNDLE_VERSION:-<unreadable>}"
          echo "embedded CLI --version:            ${EMBEDDED_VERSION:-<unreadable>}"
          echo "release tag (leading v stripped):  $TAG_VERSION"

          status=0
          # Named before the comparisons, because comparing an empty string
          # against a real version reports a mismatch and blames the wrong half.
          if [ -z "$BUNDLE_VERSION" ]; then
            echo "::error::CFBundleShortVersionString could not be read from $APP/Contents/Info.plist, so the bundle cannot be compared against the tag"
            status=1
          fi
          if [ -z "$EMBEDDED_VERSION" ]; then
            echo "::error::no version could be read from the CLI embedded at $APP/Contents/MacOS/glomeris, so the binary being released cannot be identified"
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$BUNDLE_VERSION" != "$EMBEDDED_VERSION" ]; then
            echo "::error::the app bundle reports $BUNDLE_VERSION but the CLI it embeds reports $EMBEDDED_VERSION"
            status=1
          fi
          if [ "$EMBEDDED_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::the embedded CLI reports $EMBEDDED_VERSION but this asset is being attached to tag $TAG"
            status=1
          fi

          # HORO-1466: the same "prove the construction worked" rule applied to
          # the identity stamp. PlistBuddy would have failed loudly above, but
          # `codesign --deep` runs between there and here, and a stamp that did
          # not survive it would leave a shipped app that reports "this build
          # records no expected tool" — indistinguishable from a developer
          # build, and silently so.
          STAMPED_SHA256="$(
            /usr/libexec/PlistBuddy -c "Print :GlomerisExpectedCLISHA256" \
              "$APP/Contents/Info.plist" 2>/dev/null || true
          )"
          # HORO-1479: `|| true` for the same reason as its sibling two lines
          # above, which already had it. A pipeline under `pipefail` ends the
          # step on this line, so the echo below it and the whole comparison
          # that follows could not run in the case they exist to report.
          ACTUAL_SHA256="$(/usr/bin/shasum -a 256 "$APP/Contents/MacOS/glomeris" | awk '{print $1}' || true)"
          echo "stamped GlomerisExpectedCLISHA256: ${STAMPED_SHA256:-<absent>}"
          echo "actual embedded CLI SHA-256:       ${ACTUAL_SHA256:-<unreadable>}"
          if [ -z "$ACTUAL_SHA256" ]; then
            echo "::error::could not hash the embedded CLI at $APP/Contents/MacOS/glomeris, so there is nothing to check the Info.plist stamp against"
            status=1
          elif [ -z "$STAMPED_SHA256" ]; then
            echo "::error::Info.plist carries no GlomerisExpectedCLISHA256, so the app cannot tell whether the glomeris it resolves is the one shipped with it (HORO-1466)"
            status=1
          elif [ "$STAMPED_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "::error::Info.plist expects CLI $STAMPED_SHA256 but the embedded binary is $ACTUAL_SHA256 — a released app would report its own CLI as the wrong build"
            status=1
          fi
          exit "$status"

      - name: Zip app bundle
        run: |
          set -euo pipefail
          cd build
          ditto -c -k --sequesterRsrc --keepParent GlomerisMenuBar.app ../GlomerisMenuBar.app.zip

      - name: Upload app bundle to the release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            GlomerisMenuBar.app.zip \
            --repo "${{ github.repository }}" \
            --clobber
