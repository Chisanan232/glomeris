name: macOS App Release

# cargo-dist (release.yml, dist-managed — do not hand-edit) builds and
# publishes the Rust `glomeris` CLI tarballs but has no notion of the Swift
# menu-bar app under macos/GlomerisMenuBar/. This workflow is a separate
# pipeline that runs AFTER the release is public: it downloads both published
# CLI tarballs, combines them into one universal binary, builds
# GlomerisMenuBar.app, embeds the CLI, signs and notarizes it, and uploads the
# zipped app as an extra asset on that same release.
#
# How it starts (HORO-1935, measured): dist's `host` job publishes with
# GITHUB_TOKEN, and GitHub does not start workflows from events created by that
# token, so the `release: published` trigger below does NOT fire for a
# dist-made release (v0.2.0 has no app asset and this workflow has never run).
# In practice every release needs a manual `workflow_dispatch` with its tag.
# The `release` trigger still fires when a human publishes a release, and
# either way the signing-mode step below decides whether anything is built.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the app build to (defaults to the latest release)"
        required: false
        type: string
      allow_unsigned_dev:
        description: "DEV ONLY: build with an ad-hoc signature when no Developer ID secrets exist. Refused for any release that is not a pre-release."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: macos-app-release-${{ github.event.release.tag_name || inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    # HORO-1296: runner and Xcode pinned to match ci.yml's `macos-app` job.
    # This workflow has never actually run (it triggers only on a published
    # release, and there has not been one), and on macos-14's default Xcode
    # 15.4 its build step could not have succeeded: XcodeGen emits
    # `objectVersion = 77` and that Xcode rejects the project unopened —
    # "a future Xcode project file format (77)", exit 74. That was measured on
    # ci.yml's new job, which runs the same xcodebuild against the same
    # project, so the failure here was latent rather than hypothetical.
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Select the pinned Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Resolve release tag
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$EVENT_TAG" ]; then
            TAG="$EVENT_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName' || true)"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::no release tag could be resolved; pass the tag input explicitly"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The app is built from the tagged commit, not from whatever branch the
      # run was dispatched on: the CLI comes from the tag's release assets, and
      # a signed bundle must not mix it with different app source or workflow.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Decide signing mode (fails closed)
        # HORO-1935. Until now this workflow always produced an ad-hoc signed
        # app and attached it under the public name `GlomerisMenuBar.app.zip`,
        # which Gatekeeper rejects for any browser download. There was no way
        # for a release to say "this must be a real Developer ID build", so a
        # missing credential produced a shippable-looking, unshippable asset.
        #
        # Now there are exactly two outcomes, and anything else stops the run:
        #   signed        every Developer ID and notary secret is present. The
        #                 app is signed with the hardened runtime, notarized and
        #                 stapled, and published as GlomerisMenuBar.app.zip.
        #   unsigned-dev  a human dispatched the run with allow_unsigned_dev,
        #                 AND the target release is a pre-release. The asset is
        #                 published as GlomerisMenuBar-DEV-ONLY-unsigned.app.zip
        #                 so nobody can mistake it for a distributable build.
        # A `release: published` event with missing secrets is therefore a red
        # run with no asset, never a quietly unsigned one.
        #
        # Secrets enter this step only as present/absent booleans.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          ALLOW_UNSIGNED_DEV: ${{ inputs.allow_unsigned_dev }}
          HAVE_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 != '' }}
          HAVE_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD != '' }}
          HAVE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAVE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 != '' }}
          HAVE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID != '' }}
          HAVE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID != '' }}
        run: |
          set -euo pipefail
          missing=""
          for pair in \
            HAVE_CERT:APPLE_DEVELOPER_ID_CERT_P12_BASE64 \
            HAVE_CERT_PASSWORD:APPLE_DEVELOPER_ID_CERT_PASSWORD \
            HAVE_IDENTITY:APPLE_SIGNING_IDENTITY \
            HAVE_NOTARY_KEY:APPLE_NOTARY_API_KEY_P8_BASE64 \
            HAVE_NOTARY_KEY_ID:APPLE_NOTARY_KEY_ID \
            HAVE_NOTARY_ISSUER:APPLE_NOTARY_ISSUER_ID; do
            flag="${pair%%:*}"
            name="${pair#*:}"
            if [ "${!flag}" != "true" ]; then
              missing="$missing $name"
            fi
          done

          if [ -z "$missing" ]; then
            echo "mode=signed" >> "$GITHUB_ENV"
            echo "signing mode: signed (Developer ID, hardened runtime, notarized)"
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$ALLOW_UNSIGNED_DEV" = "true" ]; then
            IS_PRERELEASE="$(gh release view "$TAG" --repo "${{ github.repository }}" \
              --json isPrerelease --jq '.isPrerelease' || true)"
            if [ "$IS_PRERELEASE" != "true" ]; then
              echo "::error::allow_unsigned_dev is only honoured for a pre-release; $TAG is not one (or could not be read). Refusing to attach an unsigned app."
              exit 1
            fi
            echo "mode=unsigned-dev" >> "$GITHUB_ENV"
            echo "::warning::Developer ID secrets missing:$missing. Building a DEV-ONLY unsigned app for pre-release $TAG."
            exit 0
          fi

          echo "::error::Refusing to build a public app for $TAG without signing. Missing secrets:$missing. For a throwaway pre-release build, dispatch manually with allow_unsigned_dev=true."
          exit 1

      - name: Download released CLI binary archives
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # HORO-1935: the app is a universal binary (x86_64 and arm64) and
          # LSMinimumSystemVersion admits Intel Macs, but only the arm64 CLI was
          # ever embedded, so an Intel Mac would launch an app whose bundled CLI
          # cannot execute. Both release tarballs are fetched and combined below.
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --pattern "glomeris-$target.tar.xz" \
              --output "glomeris-$target.tar.xz" \
              --clobber
            gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --pattern "glomeris-$target.tar.xz.sha256" \
              --output "glomeris-$target.tar.xz.sha256" \
              --clobber
            # Signed mode would otherwise sign and notarize whatever bytes the
            # release holds; refuse a tarball that does not match dist's checksum.
            # (openssl on purpose: check-cli-identity-is-reported.sh reads any
            # line using the stamp-hash tool as the embedded-CLI hash.)
            WANT="$(awk '{print $1}' "glomeris-$target.tar.xz.sha256" || true)"
            GOT="$(openssl dgst -sha256 -r "glomeris-$target.tar.xz" | awk '{print $1}' || true)"
            if [ -z "$WANT" ] || [ "$WANT" != "$GOT" ]; then
              echo "::error::glomeris-$target.tar.xz does not match its published sha256"
              exit 1
            fi
          done

      - name: Extract glomeris binary
        run: |
          set -euo pipefail
          # `|| true` is not strictly needed — `find -print -quit` exits 0 when it
          # matches nothing, so the guard below is reachable. It is here so that
          # stays true if the command ever grows a pipe or changes tool, which is
          # how the other sites in this file came to be broken.
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            mkdir -p "extracted-$target"
            tar -xJf "glomeris-$target.tar.xz" -C "extracted-$target"
            FOUND="$(find "extracted-$target" -type f -name glomeris -print -quit || true)"
            if [ -z "$FOUND" ]; then
              echo "::error::glomeris binary not found inside glomeris-$target.tar.xz"
              exit 1
            fi
          done
          ARM_BIN="$(find extracted-aarch64-apple-darwin -type f -name glomeris -print -quit)"
          X86_BIN="$(find extracted-x86_64-apple-darwin -type f -name glomeris -print -quit)"
          mkdir -p extracted
          BIN_PATH="extracted/glomeris"
          lipo -create "$ARM_BIN" "$X86_BIN" -output "$BIN_PATH"
          chmod +x "$BIN_PATH"
          ARCHS="$(lipo -archs "$BIN_PATH")"
          echo "embedded CLI architectures: $ARCHS"
          case " $ARCHS " in
            *" arm64 "*) ;;
            *) echo "::error::universal CLI is missing arm64 ($ARCHS)"; exit 1 ;;
          esac
          case " $ARCHS " in
            *" x86_64 "*) ;;
            *) echo "::error::universal CLI is missing x86_64 ($ARCHS)"; exit 1 ;;
          esac
          echo "bin_path=$BIN_PATH" >> "$GITHUB_ENV"

      - name: Read the released CLI's own version
        # HORO-1329: the number stamped into the bundle comes from the binary
        # that is about to be embedded in it, not from the tag. The CLI inside
        # the .app is the ground truth for "what version is this app", and
        # deriving the stamp from anything else reintroduces the two-answers
        # problem this ticket exists to fix — the bundle shipped 0.1.0 while
        # the crate was at 0.2.0.
        #
        # The tag is still cross-checked, one step below, rather than trusted:
        # if the downloaded asset and the tag disagree, that is a release-
        # assembly bug and should stop the run, not be silently papered over.
        run: |
          set -euo pipefail
          # `glomeris --version` prints "glomeris X.Y.Z".
          # `|| true` is load-bearing. Without it a CLI that cannot run at all —
          # wrong architecture, missing dylib, not executable — makes this pipeline
          # non-zero, `pipefail` carries that into the assignment, and `set -e`
          # ends the step here. The error below, which names the binary that could
          # not be read, never prints and the release fails with an empty log.
          CLI_VERSION="$("$bin_path" --version | awk 'NR==1 {print $2}' || true)"
          if [ -z "$CLI_VERSION" ]; then
            echo "::error::could not read a version from '$bin_path --version'"
            exit 1
          fi
          echo "cli_version=$CLI_VERSION" >> "$GITHUB_ENV"
          echo "embedded CLI reports version $CLI_VERSION"

      - name: Build GlomerisMenuBar.app
        run: |
          set -euo pipefail
          xcodebuild \
            -project macos/GlomerisMenuBar/GlomerisMenuBar.xcodeproj \
            -scheme GlomerisMenuBar \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            MARKETING_VERSION="$cli_version"

      - name: Import Developer ID certificate
        if: env.mode == 'signed'
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # A throwaway keychain on an ephemeral runner; removed by the always()
          # step at the end. Nothing here is echoed, and the decoded certificate
          # file is deleted as soon as it is imported.
          KEYCHAIN_PATH="$RUNNER_TEMP/glomeris-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Embed released binary into app bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="build/GlomerisMenuBar.app"
          DEST="$APP/Contents/MacOS/glomeris"
          cp "$bin_path" "$DEST"
          chmod +x "$DEST"

          # HORO-1466: record WHICH binary this is, so the app can tell at
          # runtime whether the `glomeris` it resolved is this one.
          #
          # A hash and not the version string: two binaries measured on one
          # machine both answered `--version` with 0.2.0 while disagreeing
          # about whether an unscoped mutating action may be offered at all.
          # The version is stamped from the crate version and does not change
          # between merges, so a version comparison in the app would be a
          # check that cannot fail for the case it exists to catch.
          #
          # Written with PlistBuddy here rather than expanded from a build
          # setting in Sources/Info.plist deliberately. Info.plist variable
          # expansion fails SILENTLY — an unset setting leaves an empty string
          # — and an empty expected hash would read to the app as "this build
          # records none", i.e. exactly the developer-build state, in a
          # released bundle.
          #
          # HORO-1480: the ORDER below is the whole content of that ticket, so
          # it is spelled out. Ad-hoc self-sign only (identity "-", no Apple
          # Developer account or certificate involved). Embedding a new
          # executable after the build invalidates the bundle's original seal,
          # so it has to be re-sealed. This is NOT the code signing and
          # notarization Gatekeeper requires for a browser download (which sets
          # the quarantine xattr) — that needs a real Developer ID and is
          # deliberately out of scope; see HORO-1071.
          #
          # Signing comes FIRST, before the hash is taken, because a deep sign
          # signs $DEST as nested code and rewrites its bytes. This step used
          # to hash and stamp before signing, on the reasoning that editing
          # Info.plist breaks the seal so the re-sign must come last. That
          # reasoning is right about the seal and silent about the binary: the
          # stamp recorded the pre-signature hash while the bundle shipped the
          # post-signature bytes, so the two could never agree. The verify step
          # below compares exactly those two values, which means the release
          # job failed on itself and no release could complete. Measured, on a
          # bundle assembled locally in the old order: stamped
          # b04d1ee6..., shipped 24cdc9d0..., the verify step exiting 1.
          if [ "$mode" = "signed" ]; then
            # Developer ID: hardened runtime and a secure timestamp are what the
            # notary service requires of the app and of the nested CLI.
            SIGN_ARGS=(--force --options runtime --timestamp --keychain "$KEYCHAIN_PATH" --sign "$APPLE_SIGNING_IDENTITY")
          else
            SIGN_ARGS=(--force --sign -)
          fi
          codesign "${SIGN_ARGS[@]}" --deep "$APP"

          # `|| true` is load-bearing: a missing or unreadable $DEST makes shasum
          # exit non-zero, and without this the step dies here instead of printing
          # the length error below that names the file. Note the sibling site in
          # the verify step further down already had its `|| true` — this one and
          # that one sit in the same file doing the same thing.
          CLI_SHA256="$(/usr/bin/shasum -a 256 "$DEST" | awk '{print $1}' || true)"
          if [ ${#CLI_SHA256} -ne 64 ]; then
            echo "::error::expected a 64-character SHA-256 for $DEST, got '$CLI_SHA256'"
            exit 1
          fi
          /usr/libexec/PlistBuddy \
            -c "Add :GlomerisExpectedCLISHA256 string $CLI_SHA256" \
            "$APP/Contents/Info.plist"
          echo "embedded CLI SHA-256: $CLI_SHA256"

          # Re-seal the outer bundle, because the PlistBuddy write above
          # invalidated the seal the deep sign just applied.
          #
          # Deliberately NOT a deep sign. A second deep sign would re-sign
          # $DEST again and change its bytes again, reintroducing the exact
          # mismatch this ordering exists to remove. Measured: the outer-only
          # re-seal leaves $DEST byte-identical, the stamp matches the shipped
          # bytes, and `codesign --verify --deep --strict` still validates the
          # bundle including the nested glomeris.
          codesign "${SIGN_ARGS[@]}" "$APP"

      - name: Notarize and staple
        if: env.mode == 'signed'
        env:
          NOTARY_KEY_B64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Runs after the outer re-seal above, so the ticket is issued for the
          # exact bytes that ship. Stapling adds only the ticket; it does not
          # touch the embedded CLI, so the stamped hash stays valid (the verify
          # step below re-checks that rather than assuming it).
          APP="build/GlomerisMenuBar.app"
          KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          RESULT="$RUNNER_TEMP/notary-result.json"
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s' "$NOTARY_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/notarize-submission.zip"
          # `|| true` so a failed submission reaches the diagnosis below instead
          # of ending the step with the key file still on disk.
          xcrun notarytool submit "$RUNNER_TEMP/notarize-submission.zip" \
            --key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --wait --timeout 30m --output-format json > "$RESULT" || true
          STATUS="$(plutil -extract status raw -o - "$RESULT" 2>/dev/null || true)"
          SUBMISSION_ID="$(plutil -extract id raw -o - "$RESULT" 2>/dev/null || true)"
          echo "notarization status: ${STATUS:-<unreadable>} (submission ${SUBMISSION_ID:-<none>})"
          if [ "$STATUS" != "Accepted" ]; then
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" || true
            fi
            rm -f "$KEY_PATH"
            echo "::error::notarization did not return Accepted, so nothing is uploaded"
            exit 1
          fi
          rm -f "$KEY_PATH"
          # The ticket can take a moment to propagate after "Accepted", so a
          # first `staple` may report "Record not found". Retry rather than
          # redoing a whole notarization.
          stapled=""
          for attempt in 1 2 3; do
            if xcrun stapler staple "$APP"; then stapled=yes; break; fi
            echo "staple attempt $attempt failed; waiting for the ticket to propagate"
            sleep 15
          done
          if [ -z "$stapled" ]; then
            echo "::error::could not staple the notarization ticket"
            exit 1
          fi
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Verify the bundle, the embedded CLI and the tag all agree
        # HORO-1329. Three numbers that were previously unrelated:
        #   * what the .app reports (Finder, About, CFBundleShortVersionString)
        #   * what the CLI inside it reports
        #   * the tag this asset is being attached to
        # The stamp above makes the first two equal by construction, so this
        # step's job is to prove the construction actually worked — Info.plist
        # expansion is silent when it fails and would leave the literal
        # "$(MARKETING_VERSION)", or an empty string, in a shipped bundle.
        #
        # A leading "v" is the only tag decoration stripped. release.yml's
        # trigger allows other prefixes, so an unexpected tag shape fails here
        # loudly rather than producing a bundle labelled with a number nobody
        # can trace back to a release.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          APP="build/GlomerisMenuBar.app"
          # HORO-1479: both substitutions are failure-tolerant so that the
          # echoes and comparisons below run in the case they were written for.
          # PlistBuddy exits non-zero when the key is absent, and the CLI read is
          # a pipeline under `pipefail`, so either one used to end the step on
          # its own line — leaving a reader a red step, an empty log, and no
          # indication of which of the three versions could not be read. This is
          # the shape `STAMPED_SHA256` further down already had.
          BUNDLE_VERSION="$(
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
              "$APP/Contents/Info.plist" || true
          )"
          EMBEDDED_VERSION="$("$APP/Contents/MacOS/glomeris" --version | awk 'NR==1 {print $2}' || true)"
          TAG_VERSION="${TAG#v}"

          echo "bundle CFBundleShortVersionString: ${BUNDLE_VERSION:-<unreadable>}"
          echo "embedded CLI --version:            ${EMBEDDED_VERSION:-<unreadable>}"
          echo "release tag (leading v stripped):  $TAG_VERSION"

          status=0
          # Named before the comparisons, because comparing an empty string
          # against a real version reports a mismatch and blames the wrong half.
          if [ -z "$BUNDLE_VERSION" ]; then
            echo "::error::CFBundleShortVersionString could not be read from $APP/Contents/Info.plist, so the bundle cannot be compared against the tag"
            status=1
          fi
          if [ -z "$EMBEDDED_VERSION" ]; then
            echo "::error::no version could be read from the CLI embedded at $APP/Contents/MacOS/glomeris, so the binary being released cannot be identified"
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$BUNDLE_VERSION" != "$EMBEDDED_VERSION" ]; then
            echo "::error::the app bundle reports $BUNDLE_VERSION but the CLI it embeds reports $EMBEDDED_VERSION"
            status=1
          fi
          if [ "$EMBEDDED_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::the embedded CLI reports $EMBEDDED_VERSION but this asset is being attached to tag $TAG"
            status=1
          fi

          # HORO-1466: the same "prove the construction worked" rule applied to
          # the identity stamp. PlistBuddy would have failed loudly above, but
          # `codesign --deep` runs between there and here, and a stamp that did
          # not survive it would leave a shipped app that reports "this build
          # records no expected tool" — indistinguishable from a developer
          # build, and silently so.
          STAMPED_SHA256="$(
            /usr/libexec/PlistBuddy -c "Print :GlomerisExpectedCLISHA256" \
              "$APP/Contents/Info.plist" 2>/dev/null || true
          )"
          # HORO-1479: `|| true` for the same reason as its sibling two lines
          # above, which already had it. A pipeline under `pipefail` ends the
          # step on this line, so the echo below it and the whole comparison
          # that follows could not run in the case they exist to report.
          ACTUAL_SHA256="$(/usr/bin/shasum -a 256 "$APP/Contents/MacOS/glomeris" | awk '{print $1}' || true)"
          echo "stamped GlomerisExpectedCLISHA256: ${STAMPED_SHA256:-<absent>}"
          echo "actual embedded CLI SHA-256:       ${ACTUAL_SHA256:-<unreadable>}"
          if [ -z "$ACTUAL_SHA256" ]; then
            echo "::error::could not hash the embedded CLI at $APP/Contents/MacOS/glomeris, so there is nothing to check the Info.plist stamp against"
            status=1
          elif [ -z "$STAMPED_SHA256" ]; then
            echo "::error::Info.plist carries no GlomerisExpectedCLISHA256, so the app cannot tell whether the glomeris it resolves is the one shipped with it (HORO-1466)"
            status=1
          elif [ "$STAMPED_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "::error::Info.plist expects CLI $STAMPED_SHA256 but the embedded binary is $ACTUAL_SHA256 — a released app would report its own CLI as the wrong build"
            status=1
          fi

          # HORO-1935: the claims below are made about the artifact, not about
          # the steps that were meant to produce it.
          if [ "$mode" = "signed" ]; then
            DETAILS="$(codesign -dv --verbose=4 "$APP" 2>&1 || true)"
            case "$DETAILS" in
              *"Authority=Developer ID Application"*) ;;
              *) echo "::error::the app is not signed by a Developer ID Application certificate"; status=1 ;;
            esac
            case "$DETAILS" in
              *"(runtime)"*) ;;
              *) echo "::error::the app does not have the hardened runtime enabled"; status=1 ;;
            esac
            CLI_DETAILS="$(codesign -dv --verbose=4 "$APP/Contents/MacOS/glomeris" 2>&1 || true)"
            case "$CLI_DETAILS" in
              *"(runtime)"*) ;;
              *) echo "::error::the embedded CLI does not have the hardened runtime enabled"; status=1 ;;
            esac
            if ! codesign --verify --deep --strict --verbose=2 "$APP"; then
              echo "::error::codesign --verify --deep --strict failed on the final bundle"
              status=1
            fi
            FINAL_ARCHS="$(lipo -archs "$APP/Contents/MacOS/glomeris" 2>/dev/null || true)"
            case " $FINAL_ARCHS " in
              *" arm64 "*) ;;
              *) echo "::error::final embedded CLI is missing arm64 ($FINAL_ARCHS)"; status=1 ;;
            esac
            case " $FINAL_ARCHS " in
              *" x86_64 "*) ;;
              *) echo "::error::final embedded CLI is missing x86_64 ($FINAL_ARCHS)"; status=1 ;;
            esac
            if ! xcrun stapler validate "$APP" >/dev/null 2>&1; then
              echo "::error::no valid notarization ticket is stapled to the app"
              status=1
            fi
            if ! spctl --assess --type execute "$APP" >/dev/null 2>&1; then
              echo "::error::Gatekeeper (spctl) rejects the app"
              status=1
            fi
          fi
          exit "$status"

      - name: Zip app bundle
        run: |
          set -euo pipefail
          if [ "$mode" = "signed" ]; then
            ASSET="GlomerisMenuBar.app.zip"
          else
            # Named so that it cannot be mistaken for a distributable build.
            ASSET="GlomerisMenuBar-DEV-ONLY-unsigned.app.zip"
          fi
          echo "asset_name=$ASSET" >> "$GITHUB_ENV"
          cd build
          ditto -c -k --sequesterRsrc --keepParent GlomerisMenuBar.app "../$ASSET"
          cd ..
          if [ "$mode" = "signed" ]; then
            # Assess the file that will actually be uploaded, not the directory
            # it was zipped from.
            CHECK_DIR="$RUNNER_TEMP/zip-check"
            rm -rf "$CHECK_DIR" && mkdir -p "$CHECK_DIR"
            ditto -x -k "$ASSET" "$CHECK_DIR"
            xcrun stapler validate "$CHECK_DIR/GlomerisMenuBar.app"
            spctl --assess --type execute "$CHECK_DIR/GlomerisMenuBar.app"
          fi

      - name: Upload app bundle to the release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "$asset_name" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Remove the signing keychain
        if: always() && env.mode == 'signed'
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
