name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  macos-app:
    # HORO-1296: before this job existed, nothing on CI compiled the Swift
    # target or ran its test bundle. `xcodebuild` appeared in exactly one
    # workflow, macos-app-release.yml, which runs only at release time — so
    # every GlomerisMenuBar test was enforced solely by whoever remembered to
    # run it locally, and a change that broke the Swift build merged green.
    # HORO-1294 (an invisible menu-bar item, caused by a nonexistent SF
    # Symbol) added a regression test that could not protect main for exactly
    # this reason.
    #
    # Deliberately NOT path-filtered to `macos/**`. DtoGoldenFixturesTests
    # decodes the golden fixtures under `tests/fixtures/dto/` at the repo
    # root — the same files `tests/dto_golden_fixtures.rs` asserts the Rust
    # DTOs serialize to. A Rust-side field rename that updates those fixtures
    # and nothing else would leave the hand-written Swift mirrors in
    # Sources/GlomerisDtos.swift silently wrong, and a `macos/**` filter would
    # let it merge unchecked. Guarding that cross-language contract is most of
    # this job's value, so it runs on every PR.
    #
    # Runner and Xcode are both pinned, not left to the image default,
    # because some of what this job asserts is a property of the running OS.
    # That used to be MenuBarAppearanceTests.testSystemImageNameResolvesOnThisOS
    # ("does this SF Symbol exist here"); HORO-1305 replaced the stock symbol
    # with locally drawn geometry and that test with
    # testMenuBarImageActuallyDrawsInk, which rasterises the glyph through
    # AppKit and CoreGraphics and counts opaque pixels. The pin still matters
    # for the same reason: `macos-latest` would silently re-point a
    # rendering-dependent assertion at a new OS during some unrelated PR.
    #
    # It must also be an Xcode that can open the committed project at all.
    # XcodeGen 2.46.0 emits `objectVersion = 77`, and macos-14's default Xcode
    # 15.4 refuses it outright:
    #   error: Unable to read project 'GlomerisMenuBar.xcodeproj'
    #   Reason: ... in a future Xcode project file format (77)
    # (observed on this job's first run, exit 74). Xcode 26.2 is picked because
    # it is the exact version — build 17C52 — the app is developed and
    # dogfooded against, so CI asserts against the same toolchain a developer
    # sees rather than an approximation of it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select the pinned Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the glomeris CLI
        # GlomerisClientTests.testRealGlomerisDetectJSONDecodes is the only
        # test that drives the real binary through GlomerisClient, and it
        # XCTSkips when the binary is absent. Without this step it would skip
        # on every run — an unenforced test inside the job whose whole purpose
        # is to stop tests going unenforced.
        run: cargo build --bin glomeris
      - name: Verify the CLI is present so no test silently skips
        # Mirrors exactly the two locations the test itself looks in, so this
        # cannot fail a job whose test would in fact have run. The step is not
        # redundant with `cargo build` above: cargo can succeed while the
        # binary lands somewhere else (a CARGO_TARGET_DIR set later, a
        # workspace layout change), and that is precisely the case where the
        # test would go back to skipping silently.
        run: |
          if [ ! -x target/debug/glomeris ] && [ ! -x "$HOME/.cargo/shared-target/debug/glomeris" ]; then
            echo "::error::no glomeris binary at target/debug/ or ~/.cargo/shared-target/debug/ — testRealGlomerisDetectJSONDecodes would XCTSkip instead of running"
            exit 1
          fi
      - name: Test GlomerisMenuBar
        run: |
          xcodebuild test \
            -project macos/GlomerisMenuBar/GlomerisMenuBar.xcodeproj \
            -scheme GlomerisMenuBar \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  xcodeproj-drift:
    # HORO-1296: GlomerisMenuBar.xcodeproj is generated from project.yml and
    # both are committed, but xcodebuild builds the project and never reads
    # the spec — so a spec edit without regeneration leaves project.yml
    # describing a build nobody performs.
    #
    # A separate job from `macos-app` on purpose: a stale project and a
    # failing test are different problems, and neither should be able to mask
    # the other by short-circuiting a shared job.
    #
    # No Xcode pin here, unlike `macos-app`: this job never runs xcodebuild,
    # and XcodeGen's output turned out not to depend on the installed Xcode —
    # its first run, on macos-14 with Xcode 15.4, regenerated a project
    # byte-identical to one committed from Xcode 26.2 (including
    # `objectVersion = 77`, which that Xcode cannot even open). So the XcodeGen
    # pin in .xcodegen-version is what makes this check reproducible.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned XcodeGen
        # Downloaded into RUNNER_TEMP rather than the checkout so the
        # extracted tree cannot show up as untracked files in the repo the
        # next step is about to diff. `share/xcodegen` must stay a sibling of
        # `bin/` — XcodeGen finds its setting presets relative to the
        # executable — so the archive layout is used as-is.
        run: |
          set -euo pipefail
          VERSION_FILE=macos/GlomerisMenuBar/.xcodegen-version
          # HORO-1479: the same `pin` helper the actionlint job below already
          # uses, for the same defect and the same reason. Before this, a `grep`
          # matching nothing made the assignment non-zero under `pipefail`,
          # `set -e` ended the step on that line, and the next thing in the log
          # was a `curl` that never ran. There was no diagnostic here at all to
          # be unreachable — the step simply died.
          #
          # `exit 1` leaves only the substitution's subshell, so the caller's
          # assignment still fails and the step still stops. What changes is
          # that stderr names the key that was missing.
          pin() {
            local value
            value="$(grep -E "^$1=" "$VERSION_FILE" | head -1 | cut -d= -f2 || true)"
            if [[ -z "$value" ]]; then
              echo "FAIL: no '$1=' line in ${VERSION_FILE} — the pin was renamed or removed." >&2
              exit 1
            fi
            printf '%s\n' "$value"
          }
          VERSION="$(pin version)"
          SHA256="$(pin sha256)"
          cd "$RUNNER_TEMP"
          curl -fsSL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${VERSION}/xcodegen.zip"
          echo "${SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d xcodegen-dist
          echo "$RUNNER_TEMP/xcodegen-dist/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Check the committed xcodeproj matches project.yml
        run: bash scripts/check-xcodeproj-matches-xcodegen.sh

  app-icon-drift:
    # HORO-1305: the AppIcon PNGs under
    # macos/GlomerisMenuBar/Sources/Assets.xcassets are generated from
    # Sources/GlomerisMark.swift, and both are committed.
    #
    # Binary assets are the one thing a reviewer genuinely cannot review — a
    # PNG in a diff is "Binary files differ", so any claim about what the icon
    # looks like is taken on trust. Generating it from readable geometry only
    # helps if something proves the committed bytes really are that geometry's
    # output. Finder, the Dock and System Settings > Login Items read the
    # compiled asset catalog and never read the Swift, so without this a mark
    # edit with stale PNGs would ship an icon the code no longer describes.
    #
    # A separate job, for the same reason xcodeproj-drift is one: stale art
    # and a failing test are different problems and neither should mask the
    # other.
    #
    # Xcode is pinned to match `macos-app` — the comparison tolerance in
    # macos/tools/icongen/main.swift is calibrated against CoreGraphics'
    # rasteriser, so the toolchain is part of what is being asserted.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select the pinned Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
      - name: Check the committed app icon matches GlomerisMark's geometry
        run: bash scripts/check-app-icon-matches-geometry.sh

  app-version-drift:
    # HORO-1329: the app bundle reports its version from
    # macos/GlomerisMenuBar/project.yml; the CLI it embeds reports the version
    # in Cargo.toml. macos-app-release.yml puts both inside one .app, so they
    # have to be the same number — and before this ticket they were not (0.1.0
    # against 0.2.0), because nothing reads both files. cargo ignores
    # project.yml and xcodebuild ignores Cargo.toml.
    #
    # ubuntu-latest, and no Xcode or XcodeGen: the guard compares committed
    # text, including the MARKETING_VERSION in the .pbxproj that xcodebuild
    # actually builds from, so it needs neither toolchain. That is deliberate —
    # a version check that could only run on a pinned macOS runner would be the
    # first thing to be skipped.
    #
    # A separate job from xcodeproj-drift, which it does not overlap: that one
    # asks "is the project regenerated from the spec", this one asks "is the
    # number in it right". A correctly regenerated project can still ship the
    # wrong version, and a stale project can still have the right one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the app bundle version matches the crate version
        run: bash scripts/check-app-version-matches-crate.sh

  no-policy-in-swift:
    # HORO-1068: mechanical guard — GlomerisMenuBar (the macOS thin client)
    # must never branch UI behavior on `policyLabel`/`policy_label`'s string
    # content, only on structured fields like `executable`. See
    # docs/internal/HORO-1068-no-policy-in-swift-review.md.
    #
    # HORO-1306 added a second check to the same script: the display
    # vocabulary file switches on an anonymous token string, which is only
    # acceptable because it is provably incapable of acting on the result.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no policy_label branching in Swift
        run: bash scripts/check-no-policy-label-branching.sh

  credential-store-uses-keychain:
    # HORO-1309: the BYOK API key is the only secret the macOS app holds. This
    # asserts mechanically that it is keychain-backed and that nothing in the
    # app persists, logs, argues or visibly renders it.
    #
    # A source check rather than a test on purpose: an unsigned xcodebuild
    # test binary can get errSecMissingEntitlement from SecItemAdd, and a
    # keychain test that skipped on that would be a permanently green no-op.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the BYOK credential never leaves the keychain
        run: bash scripts/check-credential-store-uses-keychain.sh

  state-namespaced-by-bundle-id:
    # HORO-1456: the keychain service holding the BYOK key and the UserDefaults
    # domain holding the endpoint, model and project roots must be derived from
    # the running bundle's identifier. They were string literals equal to the
    # release identifier, so any other build read and wrote the release app's
    # state and the only way to isolate one was to patch three source files.
    #
    # A separate job from credential-store-uses-keychain: "the key is in the
    # keychain and nowhere else" and "the key is in *this build's* keychain
    # items" are different properties, and a literal that happens to be
    # correct satisfies the first while failing the second.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check stored state is namespaced by the running bundle
        run: bash scripts/check-state-namespaced-by-bundle-id.sh

  cli-identity-is-reported:
    # HORO-1466: the app hands all policy and execution authority to a
    # `glomeris` it resolves at runtime, and used to surface which one only in
    # the error raised when NOTHING was found. Two binaries on one machine both
    # answered `--version` with 0.2.0 while disagreeing about whether an
    # unscoped mutating action may be offered at all, so the identity has to be
    # a hash of the bytes and it has to be on a non-error surface.
    #
    # A separate job from app-version-matches-crate, which is the reason this
    # one exists: that job pins the version numbers to each other, and this
    # ticket is the case those numbers cannot detect. Folding the two together
    # would let "the versions agree" stand in for "it is the same build".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the resolved CLI's path and identity are reported together
        run: bash scripts/check-cli-identity-is-reported.sh

  vocabulary-covers-cli-tokens:
    # HORO-1306: the GUI's plain-language wording tables are transcribed from
    # the Rust enums by hand, so the drift that matters is the silent one —
    # the CLI learns a state and the popover shows a question mark for it.
    # This diffs the two sets in both directions.
    #
    # A separate job from no-policy-in-swift on purpose: "the GUI has no word
    # for a real state" and "the GUI might be deciding policy" are unrelated
    # problems, and neither should hide behind the other's red X.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every CLI token has GUI wording
        run: bash scripts/check-vocabulary-covers-cli-tokens.sh

  docs-cover-cli-commands:
    # HORO-1312: the book's CLI Reference had no mechanical tie to the command
    # surface, so it drifted and then excused the drift with a disclaimer
    # telling readers to trust the source instead. HORO-1311 left exactly one
    # command table (`COMMANDS` in src/cli/help.rs), which makes the set of
    # commands readable — so a new subcommand now fails CI until the reference
    # documents it.
    #
    # Deliberately only the command *set*. Flag-level and prose accuracy have
    # no canonical producer to diff against; help text itself is pinned byte
    # for byte by tests/help_golden.rs in the `test` job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the book documents every CLI command
        run: bash scripts/check-docs-cover-cli-commands.sh

  workflows-are-valid:
    # HORO-1472: every other job in this file guards something in the
    # repository, and nothing guarded these files. The only thing that reported
    # a mistake in a workflow was GitHub, when it tried to run it — a red run
    # with zero jobs and a zero-second duration, which is what a parse-time
    # rejection looks like.
    #
    # That failure mode is worse than an ordinary red X. There is no job log to
    # read; the failure is attributed to whichever pull request happened to
    # trigger the workflow rather than to the one that broke it; and a rejected
    # workflow has not run, so every check it contains goes absent rather than
    # failing. A typo in this file could therefore remove the ten guards above
    # it and read as "no checks reported" instead of as a failure.
    #
    # A separate job from the guards above on purpose, and deliberately not
    # path-filtered to `.github/**`: the set of workflow files is exactly what a
    # path filter here would be deciding, and the filter itself would be inside
    # the file being validated.
    #
    # The tools are pinned and downloaded rather than taken from the image, for
    # the reason .github/.actionlint-version gives: `ubuntu-latest` ships an
    # unpinned shellcheck, and actionlint routes every `run:` block through it,
    # so an image refresh could turn this job red on an unrelated pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned actionlint and shellcheck
        # Into RUNNER_TEMP rather than the checkout, so the extracted binaries
        # cannot show up as untracked files in the repository being linted.
        # GITHUB_PATH prepends, so these take precedence over the shellcheck
        # already on the image — and if they somehow did not, the guard's
        # version comparison fails rather than silently linting with the wrong
        # ruleset.
        run: |
          set -euo pipefail
          VERSION_FILE=.github/.actionlint-version
          # Named failure rather than a silent one. `grep` exits 1 on no match,
          # which under `pipefail` is the function's status, which under
          # `set -e` ends the step at the caller's assignment — with nothing
          # printed. A renamed pin key used to show up as a red step and an
          # empty log. `exit 1` here leaves only the subshell, so the caller's
          # assignment still fails; the difference is that stderr says which
          # key is missing.
          pin() {
            local value
            value="$(grep -E "^$1=" "$VERSION_FILE" | head -1 | cut -d= -f2 || true)"
            if [[ -z "$value" ]]; then
              echo "FAIL: no '$1=' line in ${VERSION_FILE} — the pin was renamed or removed." >&2
              exit 1
            fi
            printf '%s\n' "$value"
          }
          AL_VERSION="$(pin actionlint_version)"
          AL_SHA256="$(pin actionlint_linux_amd64_sha256)"
          SC_VERSION="$(pin shellcheck_version)"
          SC_SHA256="$(pin shellcheck_linux_x86_64_sha256)"
          DEST="$RUNNER_TEMP/pinned-linters"
          mkdir -p "$DEST"
          cd "$RUNNER_TEMP"
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_linux_amd64.tar.gz"
          echo "${AL_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C "$DEST" actionlint
          curl -fsSL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SC_VERSION}/shellcheck-v${SC_VERSION}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz -C "$DEST" --strip-components=1 \
            "shellcheck-v${SC_VERSION}/shellcheck"
          echo "$DEST" >> "$GITHUB_PATH"
      - name: Check every workflow file is valid
        run: bash scripts/check-workflows-are-valid.sh

  shell-scripts-are-clean:
    # HORO-1473: every job above runs its guard as a single line,
    # `bash scripts/check-something.sh`, which is all the shellcheck inside
    # workflows-are-valid ever saw. The several hundred lines inside each script
    # were checked by nothing, so the guards protecting everything else were the
    # least checked shell in the repository.
    #
    # The bug class that matters here is the one that makes a guard pass while
    # proving nothing: an expansion that word-splits, a variable read before
    # assignment, a pipeline whose status comes from the wrong stage. Two guards
    # here have already been found reporting PASS over something they were meant
    # to catch, for other reasons, so this is demonstrated rather than
    # hypothetical.
    #
    # A separate job from workflows-are-valid, for the reason the drift jobs are
    # separate from macos-app: steps in one job run in sequence and stop at the
    # first failure, so sharing a job would mean a broken workflow file prevents
    # the script lint from running at all — and those two are exactly the
    # failures that must not be able to hide each other.
    #
    # That costs a second copy of the install step. Accepted because the two
    # copies cannot disagree about anything that matters: both read the version
    # and the hash out of .github/.actionlint-version, and the guard itself
    # refuses to run if the binary on PATH is not that version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned shellcheck
        # Into RUNNER_TEMP rather than the checkout, so the extracted binary
        # cannot show up as an untracked file in the repository being linted —
        # which this guard would then discover and lint.
        run: |
          set -euo pipefail
          VERSION_FILE=.github/.actionlint-version
          # Named failure rather than a silent one. `grep` exits 1 on no match,
          # which under `pipefail` is the function's status, which under
          # `set -e` ends the step at the caller's assignment — with nothing
          # printed. A renamed pin key used to show up as a red step and an
          # empty log. `exit 1` here leaves only the subshell, so the caller's
          # assignment still fails; the difference is that stderr says which
          # key is missing.
          pin() {
            local value
            value="$(grep -E "^$1=" "$VERSION_FILE" | head -1 | cut -d= -f2 || true)"
            if [[ -z "$value" ]]; then
              echo "FAIL: no '$1=' line in ${VERSION_FILE} — the pin was renamed or removed." >&2
              exit 1
            fi
            printf '%s\n' "$value"
          }
          SC_VERSION="$(pin shellcheck_version)"
          SC_SHA256="$(pin shellcheck_linux_x86_64_sha256)"
          DEST="$RUNNER_TEMP/pinned-linters"
          mkdir -p "$DEST"
          cd "$RUNNER_TEMP"
          curl -fsSL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SC_VERSION}/shellcheck-v${SC_VERSION}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz -C "$DEST" --strip-components=1 \
            "shellcheck-v${SC_VERSION}/shellcheck"
          echo "$DEST" >> "$GITHUB_PATH"
      - name: Check every shell script is clean
        run: bash scripts/check-shell-scripts-are-clean.sh
