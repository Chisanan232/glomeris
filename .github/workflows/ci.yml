name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  no-policy-in-swift:
    # HORO-1068: mechanical guard — GlomerisMenuBar (the macOS thin client)
    # must never branch UI behavior on `policyLabel`/`policy_label`'s string
    # content, only on structured fields like `executable`. See
    # docs/internal/HORO-1068-no-policy-in-swift-review.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no policy_label branching in Swift
        run: bash scripts/check-no-policy-label-branching.sh
