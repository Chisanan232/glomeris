[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # Mozilla's CA-bundle data license, pulled in transitively by ureq's
    # rustls TLS backend (webpki-roots). Permissive, non-copyleft license
    # covering only the shipped root certificate data — reviewed and
    # allowed for HORO-954's ureq dependency addition.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
