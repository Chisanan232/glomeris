name: GlomerisMenuBar
options:
  bundleIdPrefix: dev.glomeris
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  GlomerisMenuBar:
    type: application
    platform: macOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "Copyright © Glomeris. All rights reserved."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.glomeris.GlomerisMenuBar
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets:
        - GlomerisMenuBarTests
  GlomerisMenuBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "Fixtures/**"
      - path: Sources/GlomerisClient.swift
      - path: Sources/ProjectRootsStore.swift
      - path: Sources/GlomerisDtos.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.glomeris.GlomerisMenuBarTests
        GENERATE_INFOPLIST_FILE: YES
