name: GlomerisMenuBar
options:
  bundleIdPrefix: dev.glomeris
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  GlomerisMenuBar:
    type: application
    platform: macOS
    sources:
      - Sources
    # NOTE: Sources/Info.plist is GENERATED from the properties below —
    # `xcodegen generate` overwrites it. Edit it here, never there.
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        # HORO-1329: the version the user sees is a build setting reference,
        # not a literal, so there is exactly one place to change it —
        # MARKETING_VERSION below — and `xcodebuild MARKETING_VERSION=x.y.z`
        # can override it at release time without editing a tracked file.
        # Xcode's "Process Info.plist" step expands `$(...)` here; the
        # neighbouring $(PRODUCT_BUNDLE_IDENTIFIER) and $(EXECUTABLE_NAME)
        # have always relied on that.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Left a literal 1 on purpose. CFBundleVersion is the build number,
        # not the release number: it is never shown to the user, and nothing
        # in this repo produces a monotonic build counter to derive it from.
        # Tying it to the crate version would make it non-monotonic across a
        # version revert, which is the one thing macOS actually cares about.
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "Copyright © Glomeris. All rights reserved."
        # HORO-1305. Both keys are declared rather than relying on the partial
        # plist actool merges in. CFBundleIconName is what modern AppKit and
        # System Settings > Login Items read from the compiled asset catalog;
        # CFBundleIconFile names the AppIcon.icns actool also emits, which is
        # the older Finder fallback. Before this ticket neither key existed and
        # there was no asset catalog at all, so the app showed the generic
        # blank icon in Finder, Login Items and Cmd-Tab.
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.glomeris.GlomerisMenuBar
        # HORO-1329. The single source of the app's user-visible version, kept
        # equal to the `version` of the glomeris crate in Cargo.toml by
        # scripts/check-app-version-matches-crate.sh. Before this ticket the
        # plist carried a hardcoded 0.1.0 while the crate was at 0.2.0, so the
        # bundle the release workflow uploads for tag vX would report a version
        # unrelated to X — and the app embeds that CLI, so "which version am I
        # running" had two different answers inside one .app.
        MARKETING_VERSION: "0.2.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        # HORO-1305. Sources/Assets.xcassets/AppIcon.appiconset is generated
        # from Sources/GlomerisMark.swift by scripts/generate-app-icon.sh;
        # scripts/check-app-icon-matches-geometry.sh keeps the two in step.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - GlomerisMenuBarTests
  GlomerisMenuBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "Fixtures/**"
      # HORO-1456: the single source of the running bundle's identifier. In
      # here because the keychain service and both preference stores derive
      # their names from it, so it has to compile into the test target for
      # those files to; and so that BundleIdentity.identity(declaredBy:) can
      # be driven over both its branches, the fallback one included, which no
      # process the app is normally run as takes.
      - path: Sources/BundleIdentity.swift
      - path: Sources/GlomerisClient.swift
      - path: Sources/GlomerisExecutableLocator.swift
      # HORO-1466: which binary was resolved and whether it is the one this app
      # was built against. Compiled in so the comparison rule is asserted
      # against the real function over all four of its outcomes — including the
      # blank-declared-hash case a silently-failed build-setting expansion
      # produces, which no real bundle in this repo can be made to exhibit.
      - path: Sources/GlomerisCliIdentity.swift
      - path: Sources/MenuBarAppearance.swift
      - path: Sources/GlomerisMark.swift
      - path: Sources/ProjectRootsStore.swift
      # HORO-1501: the table deciding which CLI commands the roots are attached
      # to. Compiled in so every command the app actually runs is asserted
      # against the real set — `status` included, which is the one that shipped
      # broken — rather than against a list retyped into the test file.
      - path: Sources/GlomerisCliProjectRootScope.swift
      # HORO-1325: the view, not just its store, so ProjectRootsWording's
      # labels can be asserted rather than read.
      - path: Sources/ProjectRootsPreferencesView.swift
      - path: Sources/GlomerisDtos.swift
      - path: Sources/GlomerisVocabulary.swift
      # HORO-1451: the clause composer every spoken row label goes through.
      # Compiled in so its termination rule is asserted against the real
      # function, and so each row's label can be checked against it rather than
      # against a restatement of the rule in the test file.
      - path: Sources/SpokenLabel.swift
      # HORO-1323: the actionability wording the candidates list, the AI plan
      # card and the Clean button all read, asserted directly rather than
      # through whichever of the three views happens to render it.
      - path: Sources/CandidateActionability.swift
      # HORO-1366: the Apply Plan preview/result vocabulary. Foundation-only
      # and view-free, so its classification and its aggregate honesty are
      # asserted against DTO fixtures directly rather than through the card
      # that draws them.
      - path: Sources/PlanApplication.swift
      # HORO-1452: the port of Rust's `human_bytes`. Compiled into the test
      # target so the golden fixture can be asserted against the real function
      # rather than against a copy of it in the test file.
      - path: Sources/GlomerisByteFormat.swift
      # HORO-1453: the single-instance rule. `decide` takes constructed instances
      # and returns a decision, so the convergence property is asserted against
      # the real function rather than against a restatement of it — and without
      # launching or terminating anything.
      - path: Sources/SingleInstanceGuard.swift
      - path: Sources/GlomerisDesignSystem.swift
      # HORO-1365: the scan and plan stores are exercised directly, so a
      # reset can be caught at the state boundary rather than only by a
      # source grep over the views that draw them. The cards below are also
      # constructed against those stores and their fetch functions driven
      # against a fixture binary, which is what makes "an explicit Refresh
      # replaces the scan" a behavioural assertion rather than a grep.
      #
      # Sources/GlomerisPopoverView.swift is deliberately NOT here. It owns the
      # stores, so a test constructing one would build a second pair unrelated
      # to the ones under test — and open the real UserDefaults suite through
      # its defaulted ProjectRootsStore to do it. What the shell has to be is a
      # fact about its source text, and OverviewStateTests reads it as text.
      - path: Sources/OverviewState.swift
      - path: Sources/StatusHealthSectionView.swift
      - path: Sources/CandidatesSectionView.swift
      - path: Sources/CandidateDetailView.swift
      - path: Sources/HistoryAuditSectionView.swift
      - path: Sources/AiPlanSectionView.swift
      # HORO-1506: the recovery goal card. Compiled in for two reasons the other
      # cards do not have. Its two summary types turn a report into every
      # sentence the user reads about a run that has already deleted things, so
      # the rules worth pinning — a stop is never worded as success unless the
      # CLI measured the goal as met, and the three reclaimable figures are never
      # added together — are assertions against real fixtures here rather than a
      # grep. And `phase(forRunExitCode:stdout:fallbackPreview:)` is where a
      # busy execution lock would otherwise be mistaken for a refused goal: the
      # two DTOs share their required fields, so only a test can show the exit
      # code is what separates them.
      - path: Sources/RecoverySectionView.swift
      # HORO-1366: the batch itself — the only place in the target that turns a
      # provider's suggestion set into `execute` invocations. Here so its two
      # call sites can be driven against a fixture binary, and so the guards
      # that keep `execute` out of a cancellable task are assertions about a
      # compiled type rather than only about source text.
      - path: Sources/ApplyPlanView.swift
      - path: Sources/CredentialStore.swift
      # HORO-1474: the trusted-application list the AI Provider pane shows.
      # Compiled in because the two cases AC 6 pins — an empty list and an entry
      # whose binary is gone — are asserted against the real classification
      # function. Reaching them through a keychain would need an item created
      # while a binary existed and read back after it was deleted, which is not
      # something a test may arrange on the machine it runs on.
      - path: Sources/CredentialAccessList.swift
      - path: Sources/GlomerisLlmSettingsStore.swift
      - path: Sources/AiProviderPreferencesView.swift
      - path: Sources/AutopilotPreferencesView.swift
      # HORO-1507: the recovery settings pane. Compiled in because the two things
      # worth pinning are types, not pixels. `RecoverySettingsInterpretation` is
      # the only place in the app that has to tell a *refused pair* — a
      # structured rejection printed to stdout with exit 2 — apart from a usage
      # error on the same exit code, and only a test can show which stream
      # decides that. And `RecoverySettingsDraft` is what keeps the two
      # percentages from ever being sent as each other, which is the failure this
      # whole pane is shaped to prevent.
      - path: Sources/RecoveryPreferencesView.swift
      # HORO-1508: the app's half of the daemon/app seam. Compiled in because the
      # claim that matters is an exit code's *meaning*: `pressure` exits 3 to say
      # "understood, and there was nothing to record", which is not a failure and
      # must not be retried at poll speed — and it prints the only account of why
      # on stdout, where `GlomerisClient.run` would discard it. Only a test can
      # show that exit 3 with a body, exit 2 with a version-skew marker and exit 2
      # with prose are read as three different things.
      - path: Sources/PressureEpisodeClient.swift
      # HORO-1508: the background reader, compiled in because every acceptance
      # scenario AC 7 lists is a sequence of its calls. `PressureBannerPlan.decide`
      # is a pure function of a report and what this session already raised, so
      # crossing, recovery below the hysteresis margin, re-crossing, snooze and
      # ignore are assertions about values — no disk has to fill up and no banner
      # has to appear. The two that could not be checked any other way: the
      # post-snooze re-raise is a *different* banner for the *same* episode (keyed
      # on the id alone, "remind me later" would silently mean "never again"), and
      # a raise that failed must not consume the episode's one chance to be shown.
      - path: Sources/PressureEpisodeMonitor.swift
      # HORO-1508: the deep link. Compiled in for one test above all others —
      # `RecoveryDeepLink.reviewToken` is the single literal in this app that names
      # an answer in order to *act* on it rather than to word it, and
      # RecoveryDeepLinkTests asserts the CLI still publishes it. Without that, a
      # rename in `EpisodeResponse::as_str` would turn "Review & recover" into a
      # button that opens nothing and reports nothing, which no other check in the
      # repo would notice. `RecoveryDeepLinkContext` is here for the neighbouring
      # claim: it seeds the Recovery card's control through that card's own
      # conversion rather than a second rule of its own.
      - path: Sources/RecoveryDeepLink.swift
      # HORO-1508: what the notification says and which button press becomes which
      # answer. Compiled in because the two rules that matter cannot be seen
      # failing on screen. Re-posting a request whose identifier was already
      # delivered updates the old banner *in place with no new banner*, so the
      # post-snooze reminder must carry the raised count in its identifier or a
      # working snooze and a broken one look identical — silent. And *dismissing* a
      # banner must not become an answer: recording it as "ignore this alert" would
      # close an episode the user never answered. The delivery class in the same
      # file is compiled but never constructed here: `UNUserNotificationCenter
      # .current()` traps without an app bundle, which is why its centre is
      # injected with no default.
      - path: Sources/PressureNotification.swift
      # HORO-1508: the in-app alert card's wording. Compiled in because the two
      # claims worth pinning are invisible on screen. Whether the card appears for
      # someone who already answered "Remind me later" turns on the *episode*
      # rather than on `notification_due`, and keying it on the banner's field
      # would hide the only remaining route to the three answers from exactly the
      # person who asked to be reminded. And what VoiceOver says is not a
      # rendering: `spokenState` has to name the threshold and the goal as separate
      # figures, which is the one accessibility claim a sighted reviewer cannot
      # check by looking at the card.
      - path: Sources/PressureAlertSectionView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.glomeris.GlomerisMenuBarTests
        GENERATE_INFOPLIST_FILE: YES
