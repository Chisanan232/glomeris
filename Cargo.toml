[package]
name = "glomeris"
version = "0.1.0"
edition = "2021"
description = "Evidence-first, policy-constrained developer storage autopilot for macOS."
license = "Apache-2.0"
repository = "https://github.com/Chisanan232/glomeris"

[lib]
name = "glomeris"
path = "src/lib.rs"

[[bin]]
name = "glomeris"
path = "src/main.rs"

[dependencies]
nix = { version = "0.31.3", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.1", features = ["json"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
