[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# The GitHub repository to publish the Homebrew formula to (HORO-1069).
# The tap exists and carries a hand-written bootstrap formula pinned to v0.2.0.
# What is still missing is the HOMEBREW_TAP_TOKEN secret the publish job below
# authenticates with, so no release has regenerated the formula — see HORO-1320.
#
# Everything from here down is a PREDICTION, and is labelled as one because the
# wording this replaces read as though it had been measured. `publish-jobs` was
# added after v0.2.0 was tagged, so `publish-homebrew-formula` has never been in
# a real release run's job graph at all: the v0.2.0 run had six jobs, none of
# them this one, and it was green. Nothing here has been observed.
#
# Predicted from release.yml as generated. With the secret absent, the token
# handed to the tap checkout is an empty string, so the job fails either at that
# checkout or at its final `git push`. Which of the two is not knowable without
# running it — the tap is a public repo, so an anonymous clone succeeding and
# the failure landing on the push is entirely possible. It does not matter much
# either way: `persist-credentials: true` reuses that same empty credential, so
# the formula cannot reach the tap by either route.
#
# What this does NOT do is prevent a release. `host` creates the GitHub Release
# with `gh release create`, and `publish-homebrew-formula` only `needs` plan and
# host — so the release and all of dist's assets are already published when the
# failure happens. `announce` is then skipped, because it requires this job to
# have succeeded or been skipped. The predicted symptom is therefore a red
# release run with a complete release attached to it and a tap formula still
# pinned to the previous version, not a release that failed to appear.
#
# macos-app-release.yml is unaffected for the same reason: it triggers on
# `release: published`, which fires when `host` creates the release, upstream of
# this job.
tap = "Chisanan232/homebrew-tap"
# Actually run the Homebrew publish job (pushes the generated formula to the
# tap repo above) as part of releases, not just generate the formula file.
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax).
# macOS-only MVP (HORO-957): Apple Silicon is the primary target;
# x86_64-apple-darwin cross-compiles cleanly from this toolchain and is
# kept so Intel Mac users get a native artifact too. Linux/Windows are
# deliberately not targeted yet — this is a macOS-only MVP release.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

# HORO-1502: the versions of the third-party actions dist writes into the
# generated .github/workflows/release.yml.
#
# This block is the source of truth for those pins, and it exists because
# without it there is nowhere to change them. dist hard-defaults each one and
# verifies at CI time that release.yml byte-matches what it would generate, so
# an edit to the generated file — which is what Dependabot makes, having no way
# to know the file is generated — fails the `plan` job with a diff whose stated
# remedy, `dist init`, reverts the bump. The versions were unreachable from
# inside this repository, and every github-actions update PR that named one of
# them was therefore unmergeable.
#
# Every third-party `uses:` in dist's release.yml template is substituted from
# this map, so every action reference in the generated file is reachable here.
# Only the three that this configuration actually generates are listed: the
# other four in dist's default set (actions/attest, swatinem/rust-cache,
# actions/setup-node, azure/login) belong to features this repository does not
# turn on — attestations, Windows signing, npm installers — and declaring a
# version for an action that appears nowhere would be a pin nothing can check.
#
# check-dependency-updates-are-watched.sh enforces that correspondence in both
# directions: a reference in release.yml with no entry here fails, and an entry
# here that release.yml does not reference fails too.
#
# The key is `github-action-commits` and the values are tags rather than
# commits. dist's own field name says commits and its doc comment says specific
# commits, but it substitutes the string verbatim into `{action}@{value}`, so a
# tag works and is what the rest of this repository's workflows use. Pinning to
# SHAs would be a different decision than this ticket's, and would have to be
# taken for all four workflow files at once or the guard's no-split-versions
# rule would fail.
[dist.github-action-commits]
"actions/checkout" = "v7"
"actions/download-artifact" = "v8"
"actions/upload-artifact" = "v7"
